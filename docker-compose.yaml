services:
    application:
        image: 'webdevops/nginx'
        working_dir: /app
        environment:
            WEB_DOCUMENT_ROOT: /app/public
            WEB_DOCUMENT_INDEX: index.php
            WEB_PHP_SOCKET: php-fpm:9000
        volumes:
        - ./:/app
        ports:
        - '${DOCKER_WEB_PORT:-10000}:80'

    php-fpm:
        image: 'webdevops/php-dev:8.4-alpine'
        working_dir: /app
        environment:
            PHP_POST_MAX_SIZE: 256M
            PHP_UPLOAD_MAX_FILESIZE: 256M
            PHP_MEMORY_LIMIT: 1024M
            PHP_DATE_TIMEZONE: Europe/Moscow
            XDEBUG_MODE: coverage
        volumes:
        - ./:/app

    php-fpm-prod:
        image: 'webdevops/php:8.4-alpine'
        working_dir: /app
        environment:
            PHP_POST_MAX_SIZE: 256M
            PHP_UPLOAD_MAX_FILESIZE: 256M
            PHP_MEMORY_LIMIT: 1024M
            PHP_DATE_TIMEZONE: Europe/Moscow
        volumes:
        - ./:/app

    postgres:
        image: postgres:17.6-alpine
        environment:
            POSTGRES_USER: service
            POSTGRES_PASSWORD: password
            POSTGRES_DB: service
            PGDATA: /data/postgres
        volumes:
        - postgres_17_data:/data/postgres
        ports:
        - "${DOCKER_POSTGRES_PORT:-10001}:5432"

    redis:
        image: redis:alpine
        volumes:
        - redis_data:/data

    rabbitmq:
        image: rabbitmq:3.13.7-management-alpine
        ports:
        - "${DOCKER_RABBITMQ_PORT:-10002}:15672"
        volumes:
        - rabbitmq_data:/var/lib/rabbitmq

    grafana:
        image: grafana/grafana:latest
        ports:
        - "${DOCKER_RABBITMQ_PORT:-10003}:3000"
        volumes:
        - grafana_data:/var/lib/grafana
        environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=password
        - GF_USERS_ALLOW_SIGN_UP=false

    prometheus:
        image: prom/prometheus
        ports:
        - "${DOCKER_PROMETHEUS_PORT:-10004}:9090"
        volumes:
        - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        - prometheus_data:/prometheus

volumes:
    postgres_17_data:
    redis_data:
    rabbitmq_data:
    grafana_data:
    prometheus_data:
