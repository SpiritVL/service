# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    rb.url: '%env(RB_URL)%'
    rb.session: '%env(RB_SESSION)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    GuzzleHttp\Client:
        arguments:
            - config:
                timeout: 300
                connect_timeout: 30
                verify: false

    App\Command\RequestButcher\ImportCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\RequestButcher\RunCommand:
        arguments:
            $url: '%rb.url%'
            $session: '%rb.session%'

    App\Command\Files\DownloadCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\Parse\FindVariablesCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Modules\Common\Files\FilesFinder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    csv.stringReader:
        class: App\Modules\Common\Csv\StringCsvReader
    csv.nameUrlReader:
        class: App\Modules\Files\NameUrlCsvReader
    csv.requestBatchReader:
        class: App\Modules\RequestButcher\RequestBatchCsvReader

    App\Modules\Common\Csv\CsvReaderInterface $stringCsvReader: '@csv.stringReader'
    App\Modules\Common\Csv\CsvReaderInterface $nameUrlCsvReader: '@csv.nameUrlReader'
    App\Modules\Common\Csv\CsvReaderInterface $requestButchCsvReader: '@csv.requestBatchReader'

    # Исключаем сервисы, которые должны создаваться вручную
    App\Modules\Files\Subscribers\DownloadProgressSubscriber:
        autowire: false
        autoconfigure: false
